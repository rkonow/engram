# The Strata operator: one Deployment running `strata-server operator`,
# which installs the StrataCluster resource definition (crd.json) when it
# starts and then keeps every StrataCluster in every namespace as its spec
# says: the shards' StatefulSets, their Services, the coordinators, and the
# cluster map behind them (shards joined, copies added and removed, slots
# moved, primaries handed over). See deploy/README.md.
#
#   kubectl apply -f deploy/k8s/operator/operator.yaml
#   kubectl apply -f deploy/k8s/operator/cluster.yaml
#
# It reaches each cluster's coordinators through their Service, so it runs
# in the cluster. To watch one namespace only, add --namespace NAME to its
# args (and a Role in place of the ClusterRole, if you like).
apiVersion: v1
kind: Namespace
metadata:
  name: strata-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: strata-operator
  namespace: strata-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: strata-operator
rules:
  # Installing and updating its own resource definition (--no-crd: not).
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, create, patch]
  # (patch: the coordinators of a cluster may change its sizes, and a Role
  # grants only what its maker holds.)
  - apiGroups: [strata.chloetech.ai]
    resources: [strataclusters]
    verbs: [get, list, watch, patch]
  - apiGroups: [strata.chloetech.ai]
    resources: [strataclusters/status]
    verbs: [get, patch, update]
  # What a cluster is made of.
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps, serviceaccounts]
    verbs: [get, create, patch]
  # The coordinators' account, which reads and scales its own cluster.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, create, patch]
  # Which copies are ready, and the volumes of a shard that left.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list, delete]
  # A cluster's tokenSecret, to call its coordinators.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: strata-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: strata-operator
subjects:
  - kind: ServiceAccount
    name: strata-operator
    namespace: strata-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata-operator
  namespace: strata-system
  labels: {app.kubernetes.io/name: strata-operator}
spec:
  # One at a time: two would each take the same step.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: strata-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: strata-operator}
    spec:
      serviceAccountName: strata-operator
      containers:
        - name: operator
          image: strata-server:dev
          imagePullPolicy: IfNotPresent
          args: [operator]
          env:
            - {name: RUST_LOG, value: info}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 256Mi}
